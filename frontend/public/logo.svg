<svg xmlns="http://www.w3.org/2000/svg" width="508" height="365" viewBox="0 0 508 365">
  <defs>
    <linearGradient id="grad-left" x1="0.20" y1="0.0" x2="0.90" y2="1.0">
      <stop offset="0%"   stop-color="#59F2AF"/>
      <stop offset="58%"  stop-color="#B7E86A"/>
      <stop offset="100%" stop-color="#FFC445"/>
    </linearGradient>

    <linearGradient id="grad-right" x1="0.05" y1="0.0" x2="0.85" y2="1.0">
      <stop offset="0%"   stop-color="#D7E95B"/>
      <stop offset="43%"  stop-color="#FFC447"/>
      <stop offset="100%" stop-color="#F3322B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="508" height="365" fill="#0A0619" rx="16"/>

  <!-- Logo mark -->
  <g>
