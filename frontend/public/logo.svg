         L 243 134
         L 269 160
         L 232 160
         Q 228 160 225 157
         L 208 140
         Q 204 135 209 129
         Z"
      fill="url(#grad-left)"
    />

    <!-- Lower-right ribbon -->
    <path
      d="M 309 108
         Q 312 108 315 111
         L 331 127
         Q 336 133 331 138
         L 269 199
         L 250 180
         L 296 134
         L 274 112
         Z"
      fill="url(#grad-right)"
    />
  </g>

  <!-- Main wordmark -->
  <text
    x="134"
    y="278"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="86"
    font-weight="500"
    letter-spacing="7">
    ITIMS
  </text>

  <!-- Subtitle -->
  <text
    x="254"
    y="312"
    fill="#FFFFFF"
    text-anchor="middle"
    font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif"
    font-size="23"
    font-weight="400"
    letter-spacing="1.25">
    IT INFRASTRUCTURE MANAGEMENT
  </text>
</svg>
